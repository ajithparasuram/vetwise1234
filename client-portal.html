<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#112b73" />
<title>VetWise — Client Portal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
:root{font-family:'DM Sans',sans-serif;color:#14203b;background:#f7f8fb;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;min-width:320px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}
.app-shell{min-height:100vh;background:#f7f8fb}
.sidebar{position:fixed;z-index:10;inset:0 auto 0 0;width:224px;background:#112b73;color:#d6e0ff;display:flex;flex-direction:column}
.brand{height:58px;padding:0 18px;display:flex;align-items:center;gap:10px;color:#fff;font-family:Manrope;font-size:18px;font-weight:800;border-bottom:1px solid #294486}
.brand-mark{width:28px;height:28px;border-radius:6px;background:#5169a7;display:grid;place-items:center;color:#fff}
.brand-mark svg{width:18px;height:18px}
.portal-label{font-size:10px;letter-spacing:1.2px;font-weight:700;color:#8ea5e0;padding:24px 16px 13px}
.sidebar nav{display:flex;flex-direction:column;gap:3px;padding:0 7px}
.nav-item{display:flex;align-items:center;gap:13px;color:#cbd7fb;text-align:left;padding:11px 10px;border-radius:6px;font-size:14px;font-weight:600;transition:.2s;width:100%}
.nav-item:hover,.nav-item.active{background:#425994;color:#fff}
.nav-item svg{width:17px;height:17px;flex:none}
.sidebar-bottom{margin-top:auto;border-top:1px solid #294486;padding:14px 10px 16px}
.user-mini{display:flex;align-items:center;gap:10px;font-size:11px;color:#c6d2f7;margin-bottom:16px}
.signout{display:flex;gap:10px;align-items:center;font-size:13px;color:#a9b9ed}
.signout svg{width:15px;height:15px}
.avatar{width:36px;height:36px;background:#e9edf5;color:#133174;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.avatar.small{width:27px;height:27px;background:#4964a7;color:#fff}
.avatar.large{width:46px;height:46px;font-size:17px}
.main-area{margin-left:224px;min-height:100vh}
.topbar{height:52px;background:#fff;border-bottom:1px solid #e1e5eb;display:flex;justify-content:space-between;align-items:center;padding:0 18px;color:#60708b;font-size:12px}
.top-actions{display:flex;gap:15px;align-items:center}
.icon-btn{position:relative;display:grid;place-items:center;padding:4px;color:#243755}
.icon-btn svg{width:18px;height:18px}
.icon-btn b{position:absolute;top:-2px;right:-4px;background:#ef4444;color:#fff;font-size:9px;width:15px;height:15px;border-radius:50%;display:grid;place-items:center}
.profile-btn{display:flex;align-items:center;gap:8px}
.profile-btn span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#112b73;color:white;font-weight:700}
.profile-btn svg{width:14px;height:14px}
.mobile-menu,.scrim{display:none}
.page-wrap{max-width:1260px;padding:28px 26px 60px;margin:auto}
.page-heading{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px}
.page-heading h1{font-family:Manrope;margin:0;font-size:21px;letter-spacing:-.35px}
.page-heading p{margin:4px 0 0;color:#73809a;font-size:13px}
.primary,.secondary{display:inline-flex;gap:8px;align-items:center;justify-content:center;border-radius:6px;padding:10px 14px;font-size:13px;font-weight:700;transition:.2s}
.primary{background:#112b73;color:#fff}
.primary:hover{background:#24458f;transform:translateY(-1px)}
.secondary{background:#fff;border:1px solid #dce2eb;color:#1b366f}
.primary svg,.secondary svg{width:16px;height:16px}
.searchbar{height:38px;display:flex;align-items:center;gap:9px;padding:0 12px;border:1px solid #dfe4ec;border-radius:7px;background:#fff;color:#9aa7bc}
.searchbar svg{width:17px;height:17px;flex:none}
.searchbar input{border:0;outline:0;flex:1;color:#263a5f;font-size:13px;background:none}
.searchbar input::placeholder{color:#a6b0c1}
.searchbar button svg{width:14px;height:14px}
.clients-layout,.patients-layout{display:grid;grid-template-columns:1fr 1.1fr;gap:16px}
.list-column,.patient-list{min-width:0}
.client-list,.patient-list{display:flex;flex-direction:column;gap:8px}
.client-list{margin-top:14px}
.client-card,.patient-card{display:flex;align-items:center;text-align:left;gap:12px;background:#fff;border:1px solid #dfe4eb;border-radius:7px;padding:12px;min-height:76px;box-shadow:0 1px 1px #1d31520a;transition:.2s;width:100%}
.client-card:hover,.client-card.selected,.patient-card:hover{border-color:#193b89;box-shadow:0 2px 8px #233c7020}
.card-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.card-main strong{color:#142849;font-size:14px}
.card-main span{font-size:12px;color:#53627b}
.card-main small,.last-visit small,.owner small{color:#97a2b5;font-size:11px}
.last-visit{display:flex;flex-direction:column;align-items:flex-end;gap:3px;color:#304872;font-size:12px}
.detail-card,.empty-detail,.panel,.table-card,.follow-card,.appointment-card{background:#fff;border:1px solid #dfe4eb;border-radius:7px}
.detail-card{min-height:310px}
.detail-head{display:flex;align-items:center;gap:12px;padding:19px 18px;border-bottom:1px solid #edf0f4}
.detail-head h2{margin:0;font-family:Manrope;font-size:17px}
.detail-head p{margin:4px 0 0;color:#79869c;font-size:12px}
.tabs{display:flex;gap:5px;padding:12px 18px;border-bottom:1px solid #edf0f4}
.tabs button{padding:7px 12px;border-radius:6px;color:#6c7890;font-size:12px;font-weight:600}
.tabs button.active{background:#112b73;color:white}
.detail-content{padding:17px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;border-bottom:1px solid #edf0f4;padding-bottom:19px}
.info-grid .wide{grid-column:1/-1}
.info-grid label,.eyebrow{display:block;color:#8290a9;font-size:10px;font-weight:700;letter-spacing:.8px;margin-bottom:6px}
.info-grid strong{font-size:13px;font-weight:500;color:#243b62}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:#fff;border:1px solid #dfe4eb;border-radius:7px;padding:16px 17px;display:flex;flex-direction:column;gap:5px}
.stat strong{font-family:Manrope;font-size:21px;color:#152847}
.stat span{color:#8290a2;font-size:12px}
.stat.green strong{color:#0b9b55}
.stat.orange strong{color:#dd8400}
.stat.red strong{color:#e02828}
.stat.blue strong{color:#3471da}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stats-row.four{grid-template-columns:repeat(4,1fr)}
.filter-row{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.filter-row .searchbar{flex:1}
.species-pills{display:flex;gap:5px}
.species-pills button,.view-toggle button{border:1px solid #dfe4eb;background:#fff;border-radius:6px;padding:9px 11px;font-size:12px;color:#5a6b87;white-space:nowrap}
.species-pills button.active,.view-toggle button.active{background:#112b73;color:#fff;border-color:#112b73}
.patient-card{min-height:72px}
.pet-icon{width:37px;height:37px;border-radius:50%;background:#f2f4f7;color:#78849a;display:grid;place-items:center;flex:none}
.pet-icon svg{width:19px;height:19px}
.patient-card .owner{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:155px}
.owner strong{font-size:12px;color:#243b62}
.tag{font-style:normal;font-size:9px;padding:3px 6px;border-radius:10px;margin-left:5px}
.tag.dog{background:#fff2da;color:#cc7c00}
.tag.cat{background:#eee9ff;color:#7355bc}
.tag.cattle{background:#e4f8ec;color:#159453}
.tag.horse{background:#f2e7df;color:#9b6042}
.tag.goat{background:#e8f8f5;color:#168f7f}
.tag.rabbit{background:#ffe8f2;color:#d64c84}
.muted{color:#9aa6b8;font-size:11px}
.empty-detail{display:grid;place-items:center;align-content:center;gap:8px;min-height:124px;color:#a4aebe;font-size:13px}
.empty-detail p{margin:0}
.empty-detail svg{width:34px;height:34px}
.table-card{overflow:hidden}
.table-head,.table-row{display:grid;grid-template-columns:1.15fr 2fr .75fr 1fr .8fr .65fr;align-items:center;gap:12px;padding:12px 16px}
.table-head{background:#fbfcfd;color:#8290a5;font-size:10px;font-weight:700;letter-spacing:.5px}
.table-row{min-height:70px;border-top:1px solid #eef1f5;font-size:12px;color:#4e607a}
.table-row strong{color:#162b4d;font-size:13px}
.table-row div{display:flex;flex-direction:column;gap:3px}
.table-row small{color:#99a5b6;font-size:10px}
.status{font-size:9px;font-style:normal;font-weight:800;letter-spacing:.3px;border-radius:10px;padding:4px 7px;width:max-content}
.paid,.confirmed{color:#079653;background:#ebfff4;border:1px solid #b8efd2}
.pending{color:#3575da;background:#edf5ff;border:1px solid #c7ddff}
.overdue{color:#e73535;background:#fff0f0;border:1px solid #ffc7c7}
.live{color:#d4731a;background:#fff8e6;border:1px solid #ffd9a0}
.link{display:inline-flex;align-items:center;gap:4px;color:#1c438b;font-size:12px;font-weight:600}
.link svg{width:13px;height:13px}
.follow-list{display:flex;flex-direction:column;gap:9px}
.follow-card{padding:17px 18px;display:flex;gap:14px}
.follow-card>div:nth-child(2){flex:1}
.follow-card strong{font-size:14px}
.follow-card strong small{font-size:12px;color:#75849a;font-weight:500}
.follow-card p{margin:5px 0;color:#364d71;font-size:12px}
.follow-card>div>small{color:#99a5b7;font-size:10px}
.dot{color:#b8c0cc;margin:0 3px}
.follow-actions{align-self:flex-end;display:flex;gap:14px}
.appointment-toolbar{display:flex;justify-content:space-between;margin-bottom:14px}
.date-switch,.view-toggle{display:flex;align-items:center;gap:9px}
.date-switch button{font-size:20px;color:#77849a}
.date-switch strong{font-size:14px}
.view-toggle{gap:0}
.view-toggle button{border-radius:0}
.view-toggle button:first-child{border-radius:6px 0 0 6px}
.view-toggle button:last-child{border-radius:0 6px 6px 0;margin-left:-1px}
.appointment-list{display:flex;flex-direction:column;gap:8px}
.appointment-card{display:flex;align-items:center;gap:15px;padding:14px 17px}
.time{width:78px;font-size:13px;font-weight:700;color:#1b355d}
.time small{display:block;color:#9ca8b8;font-size:10px;font-weight:400;margin-top:3px}
.appointment-card>div:nth-child(3){display:flex;flex-direction:column;gap:3px;flex:1}
.appointment-card>div:nth-child(3) span,.appointment-card>div:nth-child(3) small{font-size:12px;color:#71809a}
.more{color:#8290a4}
.more svg{width:19px;height:19px}
.dashboard .welcome{background:#eaf1ff;border:1px solid #d3e1ff;border-radius:8px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}
.welcome h2{font-family:Manrope;font-size:19px;margin:0;color:#132f65}
.welcome .eyebrow{color:#4365a3;margin-bottom:7px}
.dashboard-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:16px}
.panel{padding:18px}
.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.panel-title h3{font-family:Manrope;font-size:15px;margin:0}
.simple-row{display:flex;align-items:center;gap:11px;border-top:1px solid #edf0f4;padding:12px 0}
.simple-row>div:nth-child(2){display:flex;flex-direction:column;flex:1;gap:3px}
.simple-row strong{font-size:12px}
.simple-row small{font-size:11px;color:#8491a5}
.quick-action{display:flex;align-items:center;gap:10px;width:100%;padding:13px 0;border-top:1px solid #edf0f4;color:#3d5881;font-size:12px;text-align:left}
.quick-action svg{width:16px;height:16px}
.quick-action svg:last-child{margin-left:auto;width:14px;height:14px}
.generic-page{min-height:400px;display:grid;place-items:center}
.empty-state{text-align:center;color:#8290a6}
.empty-state h3{color:#253b5c;margin:12px 0 6px;font-family:Manrope}
.empty-state p{font-size:13px;max-width:360px;line-height:1.5;margin:0 auto 17px}
.empty-state>svg{color:#a5b0c0;width:40px;height:40px}
.empty-icon svg{width:27px;height:27px}
.modal-backdrop{position:fixed;inset:0;background:#10244d66;display:grid;place-items:center;z-index:50;padding:18px}
.modal{background:#fff;width:min(560px,100%);border-radius:10px;box-shadow:0 18px 55px #091b3a35;padding:22px;max-height:90vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between}
.modal-head h2{margin:0;font-family:Manrope;font-size:19px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
.form-grid label{font-size:11px;color:#687993;font-weight:700}
.form-grid label.wide{grid-column:1/-1}
.form-grid input,.form-grid textarea,.form-grid select{display:block;width:100%;border:1px solid #dce3ed;border-radius:6px;padding:10px;margin-top:6px;outline:0;font-size:13px;color:#263b60}
.form-grid textarea{min-height:75px;resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.payment-section{margin-bottom:22px}
.payment-section h3{font-family:Manrope;font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.payment-section h3 .count{font-size:11px;color:#8290a5;font-weight:500}
.payment-tabs{display:flex;gap:5px;margin-bottom:16px}
.payment-tabs button{padding:8px 14px;border-radius:6px;font-size:12px;font-weight:600;color:#6c7890;border:1px solid #dfe4eb;background:#fff}
.payment-tabs button.active{background:#112b73;color:#fff;border-color:#112b73}
.plan-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.plan-card{background:#fff;border:2px solid #dfe4eb;border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:.2s}
.plan-card:hover{border-color:#193b89;box-shadow:0 2px 8px #233c7020}
.plan-card.current{border-color:#112b73;background:#f8faff}
.plan-card h4{font-family:Manrope;font-size:16px;margin:0}
.plan-card .price{font-family:Manrope;font-size:24px;color:#152847}
.plan-card .price small{font-size:12px;color:#8290a2;font-weight:400}
.plan-card ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.plan-card li{font-size:12px;color:#53627b;display:flex;gap:6px;align-items:flex-start}
.plan-card li svg{width:14px;height:14px;color:#0b9b55;flex:none;margin-top:1px}
.plan-card .current-badge{font-size:10px;font-weight:700;color:#0b9b55;background:#ebfff4;border:1px solid #b8efd2;border-radius:10px;padding:3px 8px;width:max-content}
.breed-suggestions{position:relative}
.breed-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #dce3ed;border-radius:0 0 6px 6px;border-top:0;max-height:160px;overflow-y:auto;z-index:20;display:none}
.breed-list.open{display:block}
.breed-list button{display:block;width:100%;text-align:left;padding:8px 12px;font-size:12px;color:#263b60;border-bottom:1px solid #f0f2f5}
.breed-list button:hover{background:#f8faff}
.breed-list button:last-child{border-bottom:0}
.record-card{background:#fff;border:1px solid #dfe4eb;border-radius:7px;padding:16px 18px;margin-bottom:10px}
.record-card .record-pet{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #edf0f4}
.record-card .record-pet .pet-icon{width:32px;height:32px}
.record-card .record-pet strong{font-size:13px}
.record-card .record-pet small{font-size:11px;color:#8290a2}
.record-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.record-grid label{font-size:10px;color:#8290a9;font-weight:700;letter-spacing:.5px}
.record-grid strong{font-size:12px;font-weight:500;color:#243b62}
.rx-card{background:#fff;border:1px solid #dfe4eb;border-radius:7px;padding:16px 18px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
.rx-card .pet-icon{width:36px;height:36px}
.rx-card>div:nth-child(2){flex:1}
.rx-card strong{font-size:14px}
.rx-card small{font-size:11px;color:#8290a2}
.rx-card .rx-meds{margin:8px 0;font-size:12px;color:#364d71}
.rx-actions{display:flex;gap:10px;align-self:flex-start}
.profile-form{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:560px}
.profile-form label{font-size:11px;color:#687993;font-weight:700}
.profile-form label.wide{grid-column:1/-1}
.profile-form input{display:block;width:100%;border:1px solid #dce3ed;border-radius:6px;padding:10px;margin-top:6px;outline:0;font-size:13px;color:#263b60}
.profile-form .save-row{grid-column:1/-1;display:flex;gap:8px;margin-top:4px}
@media(max-width:980px){.sidebar{width:205px}.main-area{margin-left:205px}.clients-layout,.patients-layout{grid-template-columns:1fr}.detail-card,.empty-detail{min-height:280px}.patients-layout .empty-detail{display:none}.filter-row{flex-wrap:wrap}.filter-row .searchbar{min-width:100%}.dashboard-grid{grid-template-columns:1fr}.table-card{overflow-x:auto}.table-head,.table-row{min-width:800px}.plan-grid{grid-template-columns:1fr}}
@media(max-width:680px){.sidebar{transform:translateX(-100%);transition:.22s;width:250px;box-shadow:12px 0 30px #091b3a40}.sidebar.open{transform:translateX(0)}.scrim{display:block;position:fixed;z-index:9;inset:0;background:#07163180}.main-area{margin-left:0}.mobile-menu{display:grid;place-items:center;color:#18366e}.mobile-menu svg{width:20px;height:20px}.topbar{padding:0 14px}.date{margin-right:auto;margin-left:12px}.page-wrap{padding:22px 14px 45px}.page-heading{gap:12px}.heading-actions .primary{padding:9px 10px;font-size:11px}.stats-row,.stats-row.four{grid-template-columns:1fr 1fr}.stat{padding:13px}.stat strong{font-size:18px}.client-card{min-height:71px}.last-visit{display:none}.detail-card{min-height:0}.tabs{overflow:auto}.tabs button{white-space:nowrap}.info-grid{grid-template-columns:1fr}.info-grid .wide{grid-column:auto}.patient-card .owner{display:none}.appointment-card{gap:10px;padding:12px}.appointment-card .status{display:none}.time{width:62px;font-size:11px}.follow-card{padding:14px;flex-wrap:wrap}.follow-actions{width:100%;padding-top:10px;border-top:1px solid #edf0f4}.dashboard .welcome{display:block;padding:18px}.welcome .primary{margin-top:16px}.form-grid{grid-template-columns:1fr}.form-grid label.wide{grid-column:auto}.profile-form{grid-template-columns:1fr}.profile-form label.wide{grid-column:auto}.plan-grid{grid-template-columns:1fr}.record-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark" id="brandIcon"></div><span>VetWise</span></div>
    <div class="portal-label" id="portalLabel">CLIENT PORTAL</div>
    <nav id="nav"></nav>
    <div class="sidebar-bottom">
      <div class="user-mini"><div class="avatar small" id="userAvatar">P</div><span id="userName">Priya Sharma</span></div>
      <button class="signout" onclick="location.href='login.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg> Sign out</button>
    </div>
  </aside>
  <div class="scrim" id="scrim" onclick="closeMobile()"></div>
  <main class="main-area">
    <header class="topbar">
      <button class="mobile-menu" onclick="openMobile()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg></button>
      <span class="date">Sun, 28 Sept, 2026</span>
      <div class="top-actions">
        <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
        <button class="profile-btn" onclick="navigate('Profile')"><span>P</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
    </header>
    <div class="page-wrap">
      <div class="page-heading">
        <div><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle">Welcome back, Priya</p></div>

function renderAddPetModal(){
  var breedOpts=breeds.map(function(b){return '<button type="button" onclick="selectBreed(\''+b.replace(/'/g,"\\'")+'\')">'+b+'</button>';}).join('');
  return '<div class="modal-backdrop" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><div><p class="eyebrow">VETWISE</p><h2>Add a Pet</h2></div><button class="icon-btn" onclick="closeModal()">'+svg('x',18)+'</button></div><div class="form-grid"><label>Pet Name<input id="pet-name" placeholder="Enter pet name" /></label><label>Species<select id="pet-species"><option value="">Select species</option><option>Dog</option><option>Cat</option><option>Cattle</option><option>Horse</option><option>Goat</option><option>Rabbit</option><option>Other</option></select></label><label class="breed-suggestions">Breed<div style="position:relative"><input id="pet-breed" placeholder="Search or type breed" oninput="filterBreeds(this.value)" onfocus="showBreeds()" /><div class="breed-list" id="breedList">'+breedOpts+'</div></div></label><label>Sex<select id="pet-sex"><option value="">Select sex</option><option>Male</option><option>Female</option></select></label><label>Color<input id="pet-color" placeholder="e.g. Golden, Black & White" /></label><label>Age / DOB<input id="pet-age" placeholder="e.g. 3y 2m or 2023-07-15" /></label><label>Weight<input id="pet-weight" placeholder="e.g. 28.5 kg" /></label><label>Identification (optional)<input id="pet-id" placeholder="Microchip or tag number" /></label><label class="wide">Notes<textarea id="pet-notes" placeholder="Any additional information about your pet"></textarea></label></div><p style="font-size:11px;color:#8290a5;margin:0 0 14px">This pet will be registered to your account. You cannot assign pets to another owner.</p><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="submitPet()">'+svg('check',16)+' Add Pet</button></div></div></div>';
}
function renderBookVisitModal(){
  var petOpts=myPets.map(function(p){return '<option>'+p.name+'</option>';}).join('');
  return '<div class="modal-backdrop" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><div><p class="eyebrow">VETWISE</p><h2>Book a Visit</h2></div><button class="icon-btn" onclick="closeModal()">'+svg('x',18)+'</button></div><div class="form-grid"><label>Pet<select id="visit-pet"><option value="">Select your pet</option>'+petOpts+'</select></label><label>Visit Type<select id="visit-type"><option value="">Select type</option><option>Home Visit</option><option>Teleconsultation</option><option>Clinic Visit</option><option>Vaccination</option><option>Emergency</option></select></label><label>Preferred Date<input id="visit-date" type="date" /></label><label>Preferred Time<input id="visit-time" type="time" /></label><label class="wide">Reason<textarea id="visit-reason" placeholder="Briefly describe the reason for the visit"></textarea></label></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="submitVisit()">'+svg('check',16)+' Request Visit</button></div></div></div>';
}
function render(){renderSidebar();renderHeading();renderContent();renderModal();}
window.navigate=function(p){state.page=p;state.selectedPet=null;render();};
window.selectPet=function(i){state.selectedPet=i;render();};
window.setPaymentTab=function(t){state.paymentTab=t;render();};
window.openMobile=function(){document.getElementById('sidebar').classList.add('open');document.getElementById('scrim').style.display='block';};
window.closeMobile=function(){document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').style.display='none';};
window.openModal=function(t){state.modal=t;renderModal();};
window.closeModal=function(){state.modal=null;renderModal();};
window.selectBreed=function(b){var inp=document.getElementById('pet-breed');if(inp)inp.value=b;var bl=document.getElementById('breedList');if(bl)bl.classList.remove('open');};
window.filterBreeds=function(v){
  var bl=document.getElementById('breedList');if(!bl)return;
  var filtered=breeds.filter(function(b){return b.toLowerCase().indexOf(v.toLowerCase())>=0;});
  bl.innerHTML=filtered.map(function(b){return '<button type="button" onclick="selectBreed(\''+b.replace(/'/g,"\\'")+'\')">'+b+'</button>';}).join('');
  bl.classList.add('open');
};
window.showBreeds=function(){var bl=document.getElementById('breedList');if(bl)bl.classList.add('open');};
window.submitPet=function(){
  var name=document.getElementById('pet-name').value.trim();
  var species=document.getElementById('pet-species').value;
  var breed=document.getElementById('pet-breed').value.trim();
  var sex=document.getElementById('pet-sex').value;
  var color=document.getElementById('pet-color').value.trim();
  var age=document.getElementById('pet-age').value.trim();
  var weight=document.getElementById('pet-weight').value.trim();
  if(!name||!species||!breed||!sex){alert('Please fill in pet name, species, breed, and sex.');return;}
  myPets.push({name:name,species:species,breed:breed,color:color||'Not specified',sex:sex,age:age||'Not specified',weight:weight||'Not specified',visits:0,lastVisit:'No visits yet'});
  closeModal();render();
  alert('Pet "'+name+'" has been added to your account. Note: Backend API integration is required for persistence. This pet will not persist after page reload until the API is connected.');
};
window.submitVisit=function(){
  var pet=document.getElementById('visit-pet').value;
  var type=document.getElementById('visit-type').value;
  var date=document.getElementById('visit-date').value;
  if(!pet||!type||!date){alert('Please select a pet, visit type, and date.');return;}
  closeModal();
  alert('Visit request submitted for '+pet+' on '+date+'. Note: Backend API integration is required to persist this request.');
};
window.saveProfile=function(){
  state.profile.name=document.getElementById('pf-name').value;
  state.profile.phone=document.getElementById('pf-phone').value;
  state.profile.email=document.getElementById('pf-email').value;
  state.profile.address=document.getElementById('pf-address').value;
  render();
  alert('Profile updated. Note: Backend API integration is required for persistence.');
};
window.resetProfile=function(){render();};
document.addEventListener('click',function(e){
  if(!e.target.closest('.breed-suggestions')){var bl=document.getElementById('breedList');if(bl)bl.classList.remove('open');}
});
render();
})();
</script>
</body>
</html>
